<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>숫자야구 온라인</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<style>:root{--bg:#f1f5ef;--card:#fff;--ink:#1f2a24;--sub:#66756b;--line:#d9e2d8;--pri:#2f7d4f;--priH:#256a42;--priT:#fff;--S:#e8590c;--B:#1c7ed6;--O:#868e96;--W:#2f9e44;--warn:#c92a2a;--chip:#edf3ec;--shadow:0 2px 10px rgba(30,60,40,.08)}
[data-theme=dark]{--bg:#141d17;--card:#1d2a22;--ink:#e8f0ea;--sub:#9db0a3;--line:#33463b;--pri:#4cae75;--priH:#5cc085;--priT:#0f1a13;--chip:#26382d;--shadow:0 2px 10px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--ink)}
#app{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.5px}
.top h1 span{color:var(--pri)}
.top h1 small{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px}
.ib:hover{border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:700}
.card label{display:block;font-weight:700;font-size:14px;margin:10px 0 5px}
.card input[type=text],.card input[type=password],.card input:not([type]),.card input[type=tel]{width:100%;padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:18px}
.card input:focus{outline:none;border-color:var(--pri)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:130px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center}
.seg button small{display:block;font-weight:400;opacity:.75;font-size:12px;margin-top:2px}
.seg button.on{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.seg.mini button{min-width:70px;padding:8px 10px}
.big{width:100%;border:0;background:var(--pri);color:var(--priT);font-size:20px;font-weight:800;padding:14px;border-radius:12px;margin-top:12px}
.big:hover{background:var(--priH)}
.big:disabled{opacity:.5;cursor:default}
.sm{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700}
.sm:hover:not(:disabled){border-color:var(--pri)}
.sm:disabled{opacity:.45;cursor:default}
.sm.pri{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.sm.warn{border-color:var(--warn);color:var(--warn)}
.err{color:var(--warn);font-weight:700;min-height:22px;margin-top:6px}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.pill.turn{background:var(--pri);color:var(--priT)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.empty{color:var(--sub);font-size:14px;padding:6px 0}
.chip{display:inline-block;border-radius:8px;padding:3px 10px;font-weight:800;font-size:14px;margin-right:4px;color:#fff;white-space:nowrap}
.chip.S{background:var(--S)}.chip.B{background:var(--B)}.chip.O{background:var(--O)}.chip.W{background:var(--W)}.chip.P{background:var(--sub)}
.boards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px;max-height:340px;overflow:auto}
.board.act{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.board h3{margin:0 0 8px;font-size:14px;color:var(--sub)}
.g{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.g:last-child{border-bottom:0}
.g .no{width:26px;color:var(--sub);font-size:13px;text-align:right}
.g .num{font-size:22px;font-weight:800;letter-spacing:4px;width:92px}
.memo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:800}
.m1{background:#d3f9d8;border-color:#2f9e44;color:#1b5e20}
.m2{background:#e9ecef;border-color:#adb5bd;color:#adb5bd;text-decoration:line-through}
.m3{background:#fff3bf;border-color:#f59f00;color:#7a5200}
[data-theme=dark] .m1{background:#1f4a2c;color:#b7f0c4}[data-theme=dark] .m2{background:#2a2f2c;color:#6b756e}[data-theme=dark] .m3{background:#4a3c12;color:#ffe08a}
.legend{font-size:12px;color:var(--sub);margin-top:6px}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cands span{background:var(--chip);border-radius:8px;padding:3px 9px;font-weight:700;letter-spacing:2px}
.inputzone{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.inwrap{flex:1;min-width:240px}
.inwrap>label{display:block;font-weight:700;margin-bottom:8px}
#inp{width:100%;font-size:34px;letter-spacing:12px;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800}
#inp:focus{outline:none;border-color:var(--pri)}
#inp:disabled{opacity:.5}
.shake{animation:sh .3s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.pad button{height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:800}
.pad button:active{background:var(--chip)}
.pad .ok{background:var(--pri);color:var(--priT);border-color:var(--pri);font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.stugrid{display:grid;gap:12px;grid-template-columns:1.15fr 1fr;align-items:start}
.stugrid>div>.card:last-child{margin-bottom:12px}
.big2{font-size:32px;font-weight:900;text-align:center;margin:4px 0 8px}
.ans{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.ans .digit,.sec .digit{width:50px;height:60px;border-radius:12px;background:var(--pri);color:var(--priT);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.sec .digit{width:44px;height:52px;font-size:26px;background:var(--chip);color:var(--ink)}
.sec{display:flex;align-items:center;gap:8px;margin:6px 0}
.stats{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:15px}
th{color:var(--sub);font-size:13px}
td.l,th.l{text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:.95}
.warnbar{background:#fff3bf;color:#7a5200;border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:10px;font-size:14px}
/* ---------- 교사(방장) 화면 ---------- */
.hostgrid{display:grid;gap:12px;grid-template-columns:320px 1fr;align-items:start}
.hostgrid .join{text-align:center}
.codebig{font-size:76px;font-weight:900;letter-spacing:10px;color:var(--pri);line-height:1;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
.qr svg{width:220px;height:220px}
.url{font-size:12px;color:var(--sub);word-break:break-all;margin-top:8px}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.plist span{background:var(--chip);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.timer{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
.maskbtn{margin-left:6px}
tr.me td{background:var(--chip);font-weight:800}
.rank1 td:first-child{color:#e67700;font-weight:900}
/* ---------- 폰 ---------- */
@media (max-width:760px){
  #app{padding:8px 10px 120px}
  .hostgrid{grid-template-columns:1fr}
  .codebig{font-size:56px}
  .card{padding:14px 14px}
  .inputzone{gap:10px}
  .inwrap{min-width:0;width:100%}
  #inp{font-size:38px;letter-spacing:10px}
  .pad{grid-template-columns:repeat(3,1fr);width:100%;gap:10px}
  .pad button{height:58px;font-size:24px}
  .pad .ok{font-size:18px}
  .boards{grid-template-columns:1fr}
  .board{max-height:260px}
  .m{width:calc((100% - 36px)/10);min-width:24px;height:40px;font-size:16px;padding:0}
  .memo{flex-wrap:nowrap;gap:4px}
  .stugrid{grid-template-columns:1fr}
  .g .num{font-size:24px}
  .seg button{min-width:100px}
}
/* ---------- 메뉴 · 혼자 하기 ---------- */
.menu{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbtn{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px;text-align:left;box-shadow:var(--shadow)}
.mbtn:hover{border-color:var(--pri)}
.mbtn b{display:block;font-size:20px}
.mbtn small{display:block;color:var(--sub);margin-top:4px;font-size:13px}
.mbtn.main{background:var(--pri);color:var(--priT);border-color:var(--pri);padding:26px 20px}
.mbtn.main b{font-size:28px}
.mbtn.main small{color:var(--priT);opacity:.85;font-size:15px}
.mbtn.main:hover{background:var(--priH)}
.g.hint{background:var(--chip);border-radius:8px;padding:5px 6px;border-bottom:0;margin-bottom:3px}
.g .note{font-size:12px;color:var(--sub);margin-left:2px}
.rand{margin-top:8px}
.qinfo{background:var(--chip);border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.5}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
@media (max-width:760px){.mrow{grid-template-columns:1fr}.mbtn.main{padding:22px 16px}}
/* ---------- 크롬북/PC(마우스·키보드): 키패드 숨김 ---------- */
@media (hover:hover) and (pointer:fine) and (min-width:761px){
  .pad.auto{display:none}
}
